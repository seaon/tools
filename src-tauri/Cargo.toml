[package]
name = "excel-data-editor"
version = "0.1.0"
description = "Excel 数据修改工具"
authors = ["you"]
edition = "2021"

[lib]
name = "excel_data_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
umya-spreadsheet = "3"
